packages:
  - "packages/*"
  - "agents/*"
  - "apps/*"

# pnpm blocks dependency build scripts until they are reviewed. These three
# genuinely need theirs: esbuild and onnxruntime-node fetch a native binary,
# protobufjs generates code. Without this, onnxruntime-node installs without
# its native binding and fails the first time an agent actually runs inference.
#
# NOTE: this is `allowBuilds`. pnpm 11 removed `onlyBuiltDependencies` (and
# neverBuiltDependencies / ignoredBuiltDependencies) and replaced them with
# this map. The old key is silently ignored, which is exactly how it bit us.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true

# An unreviewed build script from some new transitive dependency warns instead
# of failing the whole install. We would rather find out at runtime than lose
# the build at 3am.
strictDepBuilds: false
