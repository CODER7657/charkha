services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: charkha
      POSTGRES_PASSWORD: charkha
      POSTGRES_DB: charkha
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charkha"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-producer start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:charkha@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on: { db: { condition: service_healthy } }

  matchmaker:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-matchmaker start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:charkha@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on: { db: { condition: service_healthy } }

  verifier:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-verifier start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:charkha@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on: { db: { condition: service_healthy } }

  registry:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-registry start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:charkha@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on: { db: { condition: service_healthy } }

  gateway:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/gateway start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:charkha@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    ports: ["4000:4000"]
    depends_on: [producer, matchmaker, verifier, registry]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [gateway]

volumes:
  pgdata:
  caddydata:
