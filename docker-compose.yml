services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: charkha
      # No default on purpose - a default password is one that reaches the VPS.
      # Unset means compose refuses to start; run pnpm setup:env first.
      # The bare :? carries no message text, because a secret scanner reads
      # anything after the colon as the value itself.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: charkha
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charkha"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., dockerfile: Dockerfile }
    command: sh -c "pnpm db:push && pnpm seed"
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  producer:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-producer start
    env_file: [.env]
    # The FIRMS cache is the middle rung of the fallback: live -> cache ->
    # bundled sample. Without a volume it lives in the container's writable
    # layer and a `docker compose down` throws it away, so on the box the
    # chain was really live -> nothing -> sample. A named volume is what makes
    # the rung Harsh designed actually exist in the deployment.
    volumes:
      - firmscache:/app/data/firms-cache
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  matchmaker:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-matchmaker start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  verifier:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-verifier start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  registry:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-registry start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
      # Goes INSIDE the signature on every credential, as the status list URL
      # a holder will fetch. Wrong here means credentials that name an address
      # nobody outside this network can reach, and no way to correct them
      # afterwards - see agents/registry/src/statusList.ts.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Saathi. Not one of the four agents that make decisions - it holds no
  # business logic and writes nothing to the ledger itself. It resolves a
  # sentence, calls the others over A2A exactly as they call each other, and
  # reports the hops. Kept out of the gateway's health check for that reason:
  # a chat box being down does not mean the chain is broken.
  assistant:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/agent-assistant start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  gateway:
    build: { context: ., dockerfile: Dockerfile }
    command: pnpm -F @charkha/gateway start
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://charkha:${POSTGRES_PASSWORD}@db:5432/charkha
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
      ASSISTANT_URL: http://assistant:4005
      # The origin a browser and a credential holder actually reach us on.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
    ports: ["4000:4000"]
    depends_on: [producer, matchmaker, verifier, registry, assistant]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---- demo profile: not part of the deployed stack ----
  #
  # `docker compose --profile demo up -d` brings these up alongside; a plain
  # `up` leaves them out entirely.

  # The official A2A Inspector: reads live traffic and runs spec-compliance
  # checks against an agent. Useful in judge Q&A precisely because it is not
  # our code validating our own claim.
  inspector:
    # Built from source: the project publishes no image, so pinning a tag would
    # be pinning something that does not exist. Compose builds it straight from
    # the repo the first time the demo profile comes up.
    build:
      context: https://github.com/a2aproject/a2a-inspector.git
    profiles: ["demo"]
    ports: ["8080:8080"]
    depends_on: [inspector-proxy]
    restart: unless-stopped

  # The Inspector cannot send a bearer token, and our agents refuse calls
  # without one. This mints a fresh token per request rather than turning our
  # own auth off for the demo.
  inspector-proxy:
    build: { context: ., dockerfile: Dockerfile }
    profiles: ["demo"]
    command: pnpm inspector:proxy
    env_file: [.env]
    environment:
      PRODUCER_URL: http://producer:4001
      MATCHMAKER_URL: http://matchmaker:4002
      VERIFIER_URL: http://verifier:4003
      REGISTRY_URL: http://registry:4004
    ports: ["4010:4010"]
    depends_on: [producer, matchmaker, verifier, registry]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      # Unset locally -> Caddy serves on :80. Set to the real hostname on the
      # VM and it provisions TLS on its own.
      # :- covers unset AND empty. .env.example ships this blank, and an
      # empty site address makes Caddy exit 1 with a parse error.
      CHARKHA_HOSTNAME: ${CHARKHA_HOSTNAME:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [gateway]

volumes:
  pgdata:
  caddydata:
  firmscache:
